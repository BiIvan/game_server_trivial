name: Build & Autotest

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout project and tests
        uses: actions/checkout@v4
        with:
          submodules: true
          ssh-key: ${{ secrets.TEST_TRY0_DEPLOY_KEY }}

      - name: Verify layout
        shell: bash
        run: |
          set -euxo pipefail
          git submodule status
          test -f Dockerfile
          test -f data/config.json
          test -f test_try0/scripts/sprint2/join_game/run.sh
          test -f test_try0/tests/test_s02_join_game.py

#      - name: Create Python environment for tests
#        shell: bash
#        run: |
#          set -euxo pipefail
#          python -m venv .venv
#          .venv/bin/python -m pip install --upgrade pip
#          .venv/bin/python -m pip install \
#            pytest \
#            pytest-xprocess \
#            requests \
#            jsonschema \
#            docker
#            
#      - name: Build image and run join_game tests
#        shell: bash
#        run: |
#          set -euxo pipefail
#          bash test_try0/scripts/sprint2/join_game/run.sh

      - name: Create Python environment for tests
        shell: bash
        run: |
          set -euxo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            pytest pytest-xprocess pytest-quickcheck requests jsonschema docker

      - name: Build join_game image
        shell: bash
        run: |
          set -euxo pipefail
          bash test_try0/scripts/sprint2/join_game/build.sh

      - name: Check server directly
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --pull=never \
            --name join_game_smoke \
            -p 127.0.0.1:18080:8080 \
            join_game

          trap 'docker logs join_game_smoke 2>&1 || true; docker rm -f join_game_smoke >/dev/null 2>&1 || true' EXIT

          docker ps -a --filter name=join_game_smoke

          for attempt in {1..20}; do
            if curl --noproxy '*' -sS \
              -o /tmp/join_game_maps_body \
              -w 'HTTP status: %{http_code}\n' \
              http://127.0.0.1:18080/api/v1/maps; then
              cat /tmp/join_game_maps_body
              break
            fi
            sleep 1
          done

      - name: Run join_game tests
        shell: bash
        run: |
          set -euxo pipefail
          bash test_try0/scripts/sprint2/join_game/run.sh
          
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: join-game-results
          path: join_game.xml
          if-no-files-found: ignore
