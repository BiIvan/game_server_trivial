name: Build (Linux + CMake + Boost)

on:
  push:
    branches: [ main, log ]
  pull_request:
    branches: [ main, log ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools and Boost
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-dev

      - name: Configure with CMake
        run: cmake -B build -S .

      - name: Build project
        run: cmake --build build -j$(nproc)
