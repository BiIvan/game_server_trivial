name: Build (Linux + CMake + Boost + Conan)

on:
  push:
    branches: [ main, log ]
  pull_request:
    branches: [ main, log ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Install Conan
        run: pipx install conan

      - name: Configure with CMake (with Conan)
        run: cmake -B build -S .

      - name: Build project
        run: cmake --build build -j$(nproc)
